[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wca-bench"
version = "0.1.0"
description = "WCA-Bench: a standardized sports-analytics benchmark built on World Cube Association competition data"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "WCA-Bench Project" }]
keywords = ["benchmark", "WCA", "speedcubing", "sports-analytics", "machine-learning"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyarrow>=12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
fast = ["polars>=0.20"]
boost = ["xgboost>=2.0", "lightgbm>=4.0"]
deep = ["torch>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.8"]
all = ["wca-bench[fast,boost,deep,dev]"]

[project.urls]
Documentation = "https://github.com/Maicarons/WCA-Bench"
Source = "https://github.com/Maicarons/WCA-Bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wca_bench = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/wca_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
warn_redundant_casts = false
no_implicit_optional = false
exclude = ["scripts/benchmark_parquet.py", "build", "dist"]
