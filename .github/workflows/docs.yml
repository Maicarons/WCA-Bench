name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Deployments must not run concurrently: the last one to finish wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Required by actions/deploy-pages (OIDC) and actions/upload-pages-artifact.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - uses: actions/deploy-pages@v4
        id: deployment
