version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # vitepress 1.x pins vite@^5.4.14 / esbuild@^0.21.3; the patched majors
    # (vite>=6.4.3, esbuild>=0.28.1) break the VitePress 1 build. Drop these
    # ignores once VitePress 2 is stable.
    ignore:
      - dependency-name: vite
      - dependency-name: esbuild
